<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Side Raiser</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            background: #000;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
        }
        canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
        #muteBtn {
            position: fixed; top: 12px; right: 12px;
            width: 40px; height: 40px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.18);
            background: rgba(0,0,0,0.55);
            color: white;
            font-size: 18px;
            line-height: 1;
            cursor: pointer;
            z-index: 10;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            display: flex; align-items: center; justify-content: center;
            padding: 0;
        }
        #muteBtn:hover { background: rgba(0,0,0,0.75); }
        #muteBtn:active { transform: scale(0.92); }
    </style>
</head>
<body>
<canvas id="game"></canvas>
<button id="muteBtn" type="button" aria-label="ミュート切り替え">🔊</button>
<audio id="bgm" src="audio/the_gold_medal_run.mp3" loop preload="auto"></audio>
<script src="js/config.js?v=2"></script>
<script src="js/utils.js?v=2"></script>
<script src="js/audio.js?v=2"></script>
<script src="js/components/BackgroundSystem.js?v=1"></script>
<script src="js/components/HUD.js?v=1"></script>
<script src="dictionary.js?v=3"></script>
<script>

// =====================================================
// キャンバスセットアップ
// =====================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = W; canvas.height = H;
ctx.imageSmoothingEnabled = false;

function resize() {
    const s = Math.min(window.innerWidth / W, window.innerHeight / H);
    canvas.style.width = W * s + 'px'; canvas.style.height = H * s + 'px';
}
window.addEventListener('resize', resize); resize();

// =====================================================
// キャラクター画像のプリロード
// =====================================================
const imgs = { idle: new Image(), mid: new Image(), peak: new Image() };
imgs.idle.src  = 'images/trainee_idle.png';
imgs.mid.src   = 'images/trainee_mid.png';
imgs.peak.src  = 'images/trainee_peak.png';

// =====================================================
// ゲーム状態変数
// =====================================================
let state = S.START;
let py = H/2, vy = 0, flapT = 0;
let pipes = [], lastSpawn = 0;
let day = 0;
let flashMsg = '', flashT = 0;
let shardParticles = [];

// =====================================================
// コンポーネント初期化
// =====================================================
const bgSystem = new BackgroundSystem();
const hud = new HUD();

// =====================================================
// ミュートトグル（HTML内で UI 更新）
// =====================================================
const muteBtn = document.getElementById('muteBtn');
function updateMuteUI() { muteBtn.textContent = muted ? '🔇' : '🔊'; }
muteBtn.addEventListener('click', e => {
    e.stopPropagation();
    muted = !muted;
    try { localStorage.setItem('sr_muted_v1', muted ? '1' : '0'); } catch(err) {}
    bgm.muted = muted;
    updateMuteUI();
});
muteBtn.addEventListener('pointerdown', e => e.stopPropagation());
updateMuteUI();

// =====================================================
// 時刻・天気システム
// =====================================================
function getTod() {
    return ((day + TOD_OFFSET) % TOD_CYCLE) / TOD_CYCLE;
}
function getWeather() {
    return WEATHER_SEQ[Math.floor(day / 8) % WEATHER_SEQ.length];
}

function getSkyColors(tod) {
    let i = 0;
    while (i < SKY_KEYS.length - 1 && tod > SKY_KEYS[i+1].t) i++;
    const k0 = SKY_KEYS[i], k1 = SKY_KEYS[i+1];
    const f = clamp((tod - k0.t) / (k1.t - k0.t), 0, 1);
    return { top: lerpHex(k0.top, k1.top, f), bot: lerpHex(k0.bot, k1.bot, f) };
}

// =====================================================
// 星（事前生成・点滅）
// =====================================================
const STARS = Array.from({length:60}, () => ({
    x: Math.random() * W,
    y: Math.random() * H * 0.58,
    r: 0.5 + Math.random() * 1.5,
    phase: Math.random() * Math.PI * 2,
}));

function getStarAlpha(tod) {
    if (tod < 0.20) return clamp(1 - tod / 0.20, 0, 1);   // 夜明けに消える
    if (tod > 0.76) return clamp((tod - 0.76) / 0.08, 0, 1); // 夕暮れに出る
    return 0;
}

function drawStars(alpha) {
    const t = performance.now() / 1000;
    ctx.save();
    for (const s of STARS) {
        const twinkle = 0.4 + 0.6 * Math.sin(t * 1.8 + s.phase);
        ctx.globalAlpha = alpha * twinkle;
        ctx.fillStyle = 'white';
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1; ctx.restore();
}

// =====================================================
// 太陽
// =====================================================
function getSunPos(tod) {
    if (tod < 0.23 || tod > 0.74) return null;
    const t = (tod - 0.23) / (0.74 - 0.23); // 0(日の出)〜1(日没)
    const x = lerp(20, W - 20, t);
    const y = H * 0.78 - Math.sin(t * Math.PI) * H * 0.68;
    return { x, y, t };
}

function drawSun(tod) {
    const pos = getSunPos(tod);
    if (!pos) return;
    const { x, y, t } = pos;
    const isLow = t < 0.18 || t > 0.82;
    const sunCol  = isLow ? '#ff7700' : '#ffe060';
    const glowCol = isLow ? 'rgba(255,100,0,' : 'rgba(255,210,40,';

    // グロー
    const gr = ctx.createRadialGradient(x, y, 10, x, y, 55);
    gr.addColorStop(0, glowCol + '0.35)');
    gr.addColorStop(1, glowCol + '0)');
    ctx.fillStyle = gr;
    ctx.beginPath(); ctx.arc(x, y, 55, 0, Math.PI * 2); ctx.fill();

    // 太陽本体
    ctx.fillStyle = sunCol;
    ctx.beginPath(); ctx.arc(x, y, 22, 0, Math.PI * 2); ctx.fill();

    // ハイライト
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.beginPath(); ctx.arc(x - 6, y - 6, 9, 0, Math.PI * 2); ctx.fill();
}

// =====================================================
// 月
// =====================================================
function getMoonPos(tod) {
    // 月は夕暮れ〜夜明けに見える (tod > 0.72 || tod < 0.26)
    let mt;
    if (tod >= 0.72) mt = (tod - 0.72) / 0.54;       // 0.72〜1.0
    else if (tod < 0.26) mt = (tod + 0.28) / 0.54;   // 0.0〜0.26 (0.28〜0.54にマップ)
    else return null;
    mt = clamp(mt, 0, 1);
    const x = lerp(W - 40, 40, mt);
    const y = H * 0.70 - Math.sin(mt * Math.PI) * H * 0.58;
    return { x, y };
}

function drawMoon(tod) {
    const pos = getMoonPos(tod);
    if (!pos) return;
    const { x, y } = pos;

    // グロー
    const gr = ctx.createRadialGradient(x, y, 8, x, y, 38);
    gr.addColorStop(0, 'rgba(240,240,180,0.2)');
    gr.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = gr;
    ctx.beginPath(); ctx.arc(x, y, 38, 0, Math.PI * 2); ctx.fill();

    // 月（三日月は evenodd で描く）
    ctx.fillStyle = '#ddd898';
    ctx.beginPath();
    ctx.arc(x, y, 18, 0, Math.PI * 2, false);    // 外円（時計回り）
    ctx.arc(x + 9, y - 3, 14, 0, Math.PI * 2, true); // 内円（反時計=切り抜き）
    ctx.fill('evenodd');
}

// =====================================================
// 雲
// =====================================================
let clouds = [];
function initClouds() {
    clouds = Array.from({length:4}, (_, i) => makeCloud((i / 4) * W, true));
}
function makeCloud(startX) {
    return { x: startX, y: 30 + Math.random() * 110, w: 70 + Math.random() * 100, spd: 0.18 + Math.random() * 0.35 };
}
function updateClouds() {
    for (const c of clouds) {
        c.x -= c.spd;
        if (c.x + c.w < 0) { c.x = W + 60; c.y = 25 + Math.random() * 110; c.w = 70 + Math.random() * 100; }
    }
}
function drawClouds(weather, tod) {
    const isDark = weather === 'storm' || weather === 'cloudy';
    // 曇りの場合はもっと雲を描く
    const extraAlpha = weather === 'clear' ? 0.55 : 0.82;
    for (const c of clouds) {
        drawOneCloud(c.x, c.y, c.w, extraAlpha, isDark);
    }
    if (isDark) {
        for (const c of clouds) drawOneCloud(c.x + c.w * 0.5, c.y + 15, c.w * 0.8, 0.5, true);
    }
}
function drawOneCloud(x, y, w, alpha, isDark) {
    const h = w * 0.4;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = isDark ? 'rgba(80,85,110,0.8)' : 'rgba(240,245,255,0.88)';
    [[x+w*0.2, y+h*0.5, w*0.22, h*0.5], [x+w*0.5, y, w*0.30, h*0.75], [x+w*0.8, y+h*0.4, w*0.25, h*0.6]]
        .forEach(([bx,by,bw,bh]) => { ctx.beginPath(); ctx.ellipse(bx,by,bw,bh,0,0,Math.PI*2); ctx.fill(); });
    ctx.restore();
}

// =====================================================
// パーティクル（雨・雪・風）
// =====================================================
let particles = [];
// MAX_PARTICLES is defined in js/config.js

function updateParticles(weather) {
    // 新規生成
    if (particles.length < MAX_PARTICLES) {
        if (weather === 'rain')        for (let i=0;i<5;i++) spawnRain(false);
        else if (weather === 'storm')  for (let i=0;i<12;i++) spawnRain(true);
        else if (weather === 'snow'  && Math.random() < 0.5) spawnSnow();
        else if (weather === 'wind'  && Math.random() < 0.4) spawnWind();
    }
    // 更新・削除
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy;
        if (p.type === 'snow') p.x += Math.sin(p.y * 0.035 + p.phase) * 0.45;
        if (p.y > H + 20 || p.x < -40 || p.x > W + 40) particles.splice(i, 1);
    }
}
function spawnRain(isStorm) {
    particles.push({ type:'rain', x:Math.random()*(W+80)-40, y:-15, vx:isStorm?-3.5:-0.5, vy:14+Math.random()*6 });
}
function spawnSnow() {
    particles.push({ type:'snow', x:Math.random()*W, y:-10, vx:-0.6+Math.random()*1.2, vy:1.4+Math.random()*2, r:2+Math.random()*3, phase:Math.random()*Math.PI*2 });
}
function spawnWind() {
    particles.push({ type:'wind', x:W+10, y:40+Math.random()*(H-100), vx:-11-Math.random()*7, vy:Math.random()*1-0.5, len:25+Math.random()*50 });
}
function drawParticles() {
    ctx.save();
    for (const p of particles) {
        if (p.type === 'rain') {
            ctx.strokeStyle = 'rgba(170,205,235,0.65)'; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + p.vx*0.35, p.y - p.vy*0.35); ctx.stroke();
        } else if (p.type === 'snow') {
            ctx.fillStyle = 'rgba(255,255,255,0.85)';
            ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = 'rgba(180,210,240,0.4)'; ctx.lineWidth = 0.5; ctx.stroke();
        } else if (p.type === 'wind') {
            ctx.strokeStyle = 'rgba(200,218,240,0.2)'; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + p.len, p.y + p.vy*2); ctx.stroke();
        }
    }
    ctx.restore();
}

// =====================================================
// 破片パーティクル（テキストボックス破壊エフェクト）
// =====================================================
// SHARD_GRAVITY and SHARD_LIFE are defined in js/config.js

function spawnShards(cx, cy, bw, bh) {
    // 4列×2行=8セルに分割し、内部境界をランダムにずらして不規則四角片にする
    const cols = 4, rows = 2;
    const cellW = bw / cols, cellH = bh / rows;
    const x0 = cx - bw / 2, y0 = cy - bh / 2;
    const j = 5;
    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
            const x1 = x0 + c * cellW       + (c === 0      ? 0 : (Math.random()-0.5)*j);
            const x2 = x0 + (c+1) * cellW   + (c === cols-1 ? 0 : (Math.random()-0.5)*j);
            const y1 = y0 + r * cellH       + (r === 0      ? 0 : (Math.random()-0.5)*j);
            const y2 = y0 + (r+1) * cellH   + (r === rows-1 ? 0 : (Math.random()-0.5)*j);
            const ccx = (x1 + x2) / 2, ccy = (y1 + y2) / 2;

            const dx = ccx - cx, dy = ccy - cy;
            const dist = Math.hypot(dx, dy) || 1;
            const speed = 3.2 + Math.random() * 2.8;
            const vx = (dx / dist) * speed + (Math.random()-0.5) * 0.8;
            const vy = (dy / dist) * speed + (Math.random()-0.5) * 0.8 - 1.5;

            const verts = [
                { x: x1 - ccx, y: y1 - ccy },
                { x: x2 - ccx, y: y1 - ccy },
                { x: x2 - ccx, y: y2 - ccy },
                { x: x1 - ccx, y: y2 - ccy },
            ];
            shardParticles.push({
                cx: ccx, cy: ccy, vx, vy,
                rot: 0, vrot: (Math.random()-0.5) * 0.32,
                verts,
                life: SHARD_LIFE, maxLife: SHARD_LIFE,
                flash: 2,
            });
        }
    }
    if (shardParticles.length > MAX_SHARDS) {
        shardParticles.splice(0, shardParticles.length - MAX_SHARDS);
    }
}

function updateShards() {
    for (let i = shardParticles.length - 1; i >= 0; i--) {
        const s = shardParticles[i];
        s.vy += SHARD_GRAVITY;
        s.cx += s.vx;
        s.cy += s.vy;
        s.rot += s.vrot;
        s.life--;
        if (s.flash > 0) s.flash--;
        if (s.life <= 0) shardParticles.splice(i, 1);
    }
}

function drawShards() {
    if (shardParticles.length === 0) return;
    for (const s of shardParticles) {
        const alpha = Math.max(0, s.life / s.maxLife);
        const isFlash = s.flash > 0;
        ctx.save();
        ctx.translate(s.cx, s.cy);
        ctx.rotate(s.rot);
        ctx.fillStyle = isFlash
            ? `rgba(255,255,255,${alpha})`
            : `rgba(255,138,101,${alpha})`;
        ctx.beginPath();
        ctx.moveTo(s.verts[0].x, s.verts[0].y);
        for (let i = 1; i < s.verts.length; i++) ctx.lineTo(s.verts[i].x, s.verts[i].y);
        ctx.closePath();
        ctx.fill();
        if (!isFlash) {
            ctx.strokeStyle = `rgba(255,87,34,${alpha * 0.7})`;
            ctx.lineWidth = 1;
            ctx.stroke();
        }
        ctx.restore();
    }
}

// =====================================================
// 雷
// =====================================================
let lightningFlash = 0;
let nextLightning  = 3000; // ms

function updateLightning(weather, now) {
    if (weather === 'storm') {
        if (lightningFlash > 0) { lightningFlash--; return; }
        if (now > nextLightning) {
            lightningFlash = 5 + Math.floor(Math.random() * 8);
            nextLightning  = now + 2500 + Math.random() * 5000;
        }
    } else {
        lightningFlash = 0;
    }
}
function drawLightning() {
    if (lightningFlash <= 0) return;
    ctx.fillStyle = `rgba(210,225,255,${(lightningFlash / 10) * 0.45})`;
    ctx.fillRect(0, 0, W, H);
}


// =====================================================
// 地面
// =====================================================
function drawGround() {
    ctx.fillStyle = '#111'; ctx.fillRect(0, H - 18, W, 18);
    ctx.fillStyle = '#252525'; ctx.fillRect(0, H - 18, W, 3);
}

// =====================================================
// 入力
// =====================================================
function onInput() {
    ensureAudio();
    if (state === S.START) {
        state = S.PLAY; lastSpawn = performance.now();
        vy = JUMP_PWR; flapT = 18;
        bgmPlay();
        playFlap();
        return;
    }
    if (state === S.PLAY)  { vy = JUMP_PWR; flapT = 18; playFlap(); return; }
    if (state === S.OVER || state === S.CLEAR) resetGame();
}
canvas.addEventListener('pointerdown', e => { e.preventDefault(); onInput(); });
document.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); onInput(); }
});

// =====================================================
// リセット
// =====================================================
function resetGame() {
    py = H / 2; vy = 0; flapT = 0;
    pipes = []; day = 0; lastSpawn = 0;
    flashMsg = ''; flashT = 0;
    particles = []; lightningFlash = 0;
    shardParticles = [];
    state = S.START;
}

// =====================================================
// パイプ生成
// =====================================================
function spawnPipe() {
    const topH    = 80 + Math.random() * (H - PIPE_GAP - 160);
    const nextDay = day + 1 + pipes.filter(p => !p.counted).length;
    const ob      = GAME_DICTIONARY.obstacles.find(o => o.day === nextDay);
    pipes.push({ x: W + 20, topH, text: ob ? ob.text : `Day ${nextDay}`, counted: false });
}

// =====================================================
// 当たり判定（円 vs 矩形）
// =====================================================
function hits(cx, cy, r, rx, ry, rw, rh) {
    const nx = Math.max(rx, Math.min(cx, rx+rw));
    const ny = Math.max(ry, Math.min(cy, ry+rh));
    return (cx-nx)**2 + (cy-ny)**2 < r*r;
}

// =====================================================
// ゲームロジック更新
// =====================================================
function update(now) {
    if (state !== S.PLAY) return;

    vy += GRAVITY; py += vy;
    if (flapT > 0) flapT--;
    if (flashT > 0) flashT--;

    // 天井
    if (py - HIT_R < 0) { py = HIT_R; vy = 0; }
    // 床
    if (py + HIT_R >= H - 18) { bgmStop(); state = S.OVER; return; }

    // パイプ生成
    if (now - lastSpawn > SPAWN_MS) { spawnPipe(); lastSpawn = now; }

    // パイプ移動・スコア・衝突
    for (let i = pipes.length - 1; i >= 0; i--) {
        const p = pipes[i];
        p.x -= PIPE_SPD;
        if (!p.counted && p.x + PIPE_W < PX - HIT_R) {
            p.counted = true; day++;
            // テキストボックスを破片化
            ctx.save();
            ctx.font = 'bold 13px sans-serif';
            const lines = wrapLines(p.text, 122);
            ctx.restore();
            const bw = 146, bh = lines.length * 20 + 14;
            const bcx = p.x + PIPE_W / 2, bcy = p.topH + PIPE_GAP / 2;
            spawnShards(bcx, bcy, bw, bh);
            playSmash();
            flashMsg = `Day ${day} 突破！`; flashT = 50;
            if (day >= 365) { bgmStop(); state = S.CLEAR; return; }
        }
        if (p.x + PIPE_W < -10) { pipes.splice(i, 1); continue; }
        if (hits(PX, py, HIT_R, p.x, 0, PIPE_W, p.topH) ||
            hits(PX, py, HIT_R, p.x, p.topH + PIPE_GAP, PIPE_W, H)) {
            bgmStop(); state = S.OVER; return;
        }
    }
}

// =====================================================
// パイプ描画
// =====================================================
function drawPipes() {
    for (const p of pipes) {
        drawPipeBody(p.x, 0,              PIPE_W, p.topH,                   true);
        drawPipeBody(p.x, p.topH+PIPE_GAP, PIPE_W, H - p.topH - PIPE_GAP, false);
        if (!p.counted) drawExcuseSign(p);
    }
}
function drawPipeBody(x, y, w, h, isTop) {
    const g = ctx.createLinearGradient(x, 0, x+w, 0);
    g.addColorStop(0,   '#a82000'); g.addColorStop(0.35,'#e83a18');
    g.addColorStop(0.6, '#ff5533'); g.addColorStop(1,   '#881500');
    ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = 'rgba(255,255,255,0.07)'; ctx.fillRect(x+4, y, 8, h);

    const capY = isTop ? y + h - 24 : y;
    ctx.fillStyle = '#ff6040'; ctx.fillRect(x-7, capY, w+14, 24);
    ctx.fillStyle = 'rgba(255,255,255,0.16)'; ctx.fillRect(x-7, capY, w+14, 4);
    ctx.fillStyle = 'rgba(0,0,0,0.28)'; ctx.fillRect(x-7, capY+20, w+14, 4);
}
function drawExcuseSign(p) {
    const cx = p.x + PIPE_W / 2, cy = p.topH + PIPE_GAP / 2;
    ctx.save();
    ctx.font = 'bold 13px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

    const lines = wrapLines(p.text, 122);
    const lh = 20, bh = lines.length * lh + 14, bw = 146;

    ctx.shadowColor = 'rgba(0,0,0,0.7)'; ctx.shadowBlur = 12; ctx.shadowOffsetY = 3;
    ctx.fillStyle = 'rgba(8,4,28,0.90)';
    rRect(cx - bw/2, cy - bh/2, bw, bh, 8); ctx.fill();

    ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
    ctx.strokeStyle = '#FF5722'; ctx.lineWidth = 2; ctx.stroke();

    ctx.fillStyle = '#FF8A65';
    lines.forEach((line, i) => ctx.fillText(line, cx, cy - (lines.length-1)*lh/2 + i*lh));
    ctx.restore();
}

// =====================================================
// キャラクター描画（画像ベース・2枚切り替え）
// 上昇中(vy < 0) → peak（腕上げ）
// 下降・待機中   → idle（腕下げ）
// =====================================================

// CHAR_ASPECT, CHAR_H, CHAR_ANCH are defined in js/config.js

function drawCharacter() {
    const imgKey = vy < 0 ? 'peak' : 'idle';
    const img    = imgs[imgKey];
    const dh     = CHAR_H;
    const dw     = dh * CHAR_ASPECT[imgKey];
    const tilt   = clamp(vy * 0.055, -0.45, 0.40);

    ctx.save();
    ctx.translate(PX, py);
    ctx.rotate(tilt);

    if (img && img.complete && img.naturalWidth > 0) {
        ctx.drawImage(img, -dw / 2, -dh * CHAR_ANCH, dw, dh);
    } else {
        ctx.fillStyle = '#FF5722';
        ctx.beginPath(); ctx.arc(0, 0, HIT_R, 0, Math.PI * 2); ctx.fill();
    }

    ctx.restore();
}


// =====================================================
// 各種画面
// =====================================================
function drawStartScreen() {
    ctx.fillStyle = 'rgba(0,0,15,0.74)'; ctx.fillRect(0,0,W,H);
    ctx.textAlign = 'center';
    ctx.shadowColor = 'rgba(0,0,0,0.9)'; ctx.shadowBlur = 10;

    ctx.font = 'bold 56px sans-serif'; ctx.fillStyle = '#FF5722';
    ctx.fillText('Side', W/2, H/2 - 100);
    ctx.fillStyle = '#FF8A65'; ctx.fillText('Raiser', W/2, H/2 - 42);

    ctx.shadowBlur = 4;
    ctx.font = 'bold 18px sans-serif'; ctx.fillStyle = '#FFB74D';
    ctx.fillText('サイドレイザー', W/2, H/2 + 8);
    ctx.font = '13px sans-serif'; ctx.fillStyle = '#999';
    ctx.fillText('筋トレ継続365日への道', W/2, H/2 + 33);

    if (Math.floor(performance.now() / 600) % 2) {
        ctx.shadowBlur = 0;
        ctx.font = 'bold 17px sans-serif'; ctx.fillStyle = 'white';
        ctx.fillText('タップして開始！', W/2, H/2 + 82);
    }
    ctx.shadowBlur = 0;
    ctx.font = '12px sans-serif'; ctx.fillStyle = '#444';
    ctx.fillText('Space・クリック・タップ', W/2, H - 22);
}

function drawOverScreen() {
    ctx.fillStyle = 'rgba(0,0,10,0.82)'; ctx.fillRect(0,0,W,H);
    ctx.textAlign = 'center';
    ctx.shadowColor = 'rgba(0,0,0,0.9)'; ctx.shadowBlur = 8;

    ctx.font = 'bold 38px sans-serif'; ctx.fillStyle = '#FF5722';
    ctx.fillText('GAME OVER', W/2, H/2 - 110);
    ctx.font = 'bold 32px sans-serif'; ctx.fillStyle = 'white';
    ctx.fillText(`Day ${day}`, W/2, H/2 - 68);

    ctx.shadowBlur = 0;
    const msg = getOverMsg(day);
    ctx.font = '15px sans-serif'; ctx.fillStyle = '#FF8A65';
    drawWrapped(msg, W/2, H/2 - 18, W - 70, 24);

    if (Math.floor(performance.now() / 650) % 2) {
        ctx.font = 'bold 16px sans-serif'; ctx.fillStyle = 'white';
        ctx.fillText('タップして再挑戦', W/2, H/2 + 95);
    }
}

function drawClearScreen() {
    ctx.fillStyle = 'rgba(0,0,10,0.92)'; ctx.fillRect(0,0,W,H);
    ctx.textAlign = 'center';
    ctx.shadowColor = 'rgba(255,200,0,0.8)'; ctx.shadowBlur = 20;

    ctx.font = 'bold 28px sans-serif'; ctx.fillStyle = '#FFD700';
    ctx.fillText('Day 365 達成！！', W/2, 90);
    ctx.font = 'bold 42px sans-serif'; ctx.fillText('★', W/2, 145);

    ctx.shadowBlur = 0;
    ctx.font = '14px sans-serif'; ctx.fillStyle = '#FF8A65';
    ctx.fillText(GAME_DICTIONARY.clearMessage.stat, W/2, 183);

    ctx.font = 'bold 15px sans-serif'; ctx.fillStyle = 'white';
    drawWrapped(GAME_DICTIONARY.clearMessage.message, W/2, 218, W - 60, 26);

    if (Math.floor(performance.now() / 650) % 2) {
        ctx.font = '14px sans-serif'; ctx.fillStyle = '#666';
        ctx.fillText('タップして最初から', W/2, H - 28);
    }
}

function getOverMsg(d) {
    for (const e of GAME_DICTIONARY.gameOverMessages)
        if (d >= e.minDay && d <= e.maxDay) return e.message;
    return 'また挑戦しよう！';
}

// =====================================================
// メインゲームループ
// =====================================================
initClouds();

function loop(now) {
    update(now);
    bgSystem.update(day, now);
    updateShards();

    // 描画（後ろから前の順）
    bgSystem.draw(day, now);
    drawPipes();
    drawShards();        // パイプ通過時の破片
    drawCharacter();
    drawLightning();     // 雷フラッシュ（全面に重ねる）

    if (state !== S.START) hud.draw(day, getWeather(), getTod(), flashMsg, flashT);
    if (state === S.START)  drawStartScreen();
    if (state === S.OVER)   drawOverScreen();
    if (state === S.CLEAR)  drawClearScreen();

    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
